<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกรายรับรายจ่าย</title>
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-xl bg-white shadow-xl rounded-2xl p-8 border border-slate-100">


        <h1 class="text-2xl font-bold text-center text-slate-700 mb-6">บันทึกรายรับและรายจ่าย</h1>

        <form id="budgetForm" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-600 mb-1">ชื่อรายการ:</label>
                <input type="text" name="name" id="name" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="amount" class="block text-sm font-medium text-slate-600 mb-1">จำนวนเงิน (บาท):</label>
                    <input type="number" name="amount" id="amount" required min="0"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
                <div>
                    <label for="type" class="block text-sm font-medium text-slate-600 mb-1">ประเภท:</label>
                    <select name="type" id="type" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white transition">
                        <option value="รายรับ">รายรับ</option>
                        <option value="รายจ่าย">รายจ่าย</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="date" class="block text-sm font-medium text-slate-600 mb-1">วันที่:</label>
                    <input type="date" name="date" id="date" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
                <div>
                    <label for="time" class="block text-sm font-medium text-slate-600 mb-1">เวลา:</label>
                    <input type="time" name="time" id="time"
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <input type="submit" value="บันทึก"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg cursor-pointer transition shadow-md shadow-indigo-100">
                <input type="reset" value="ล้างข้อมูล"
                    class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 px-4 rounded-lg cursor-pointer transition">
            </div>
        </form>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-8">
            <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-xl text-center">
                <p class="text-xs text-emerald-600 font-medium uppercase tracking-wider">รายรับรวม</p>
                <p id="income" class="text-lg font-bold text-emerald-700 mt-1">0.00</p>
            </div>
            <div class="bg-rose-50 border border-rose-100 p-4 rounded-xl text-center">
                <p class="text-xs text-rose-600 font-medium uppercase tracking-wider">รายจ่ายรวม</p>
                <p id="expenses" class="text-lg font-bold text-rose-700 mt-1">0.00</p>
            </div>
            <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl text-center">
                <p class="text-xs text-blue-600 font-medium uppercase tracking-wider">ยอดเงินคงเหลือ</p>
                <p id="balance" class="text-lg font-bold text-blue-700 mt-1">0.00</p>
            </div>
        </div>

        <div class="mt-8 space-y-6">
            <div>
                <h2 class="text-md font-semibold text-slate-700 mb-2 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> รายการรายรับ
                </h2>
                <ul id="incomeList" class="space-y-2 text-sm text-slate-600">
                    <!-- Javascript จะเพิ่ม li ที่นี่ -->
                </ul>
            </div>

            <div>
                <h2 class="text-md font-semibold text-slate-700 mb-2 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> รายการรายจ่าย
                </h2>
                <ul id="expensesList" class="space-y-2 text-sm text-slate-600">
                    <!-- Javascript จะเพิ่ม li ที่นี่ -->
                </ul>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <button id="clearButton"
                class="text-sm text-rose-600 hover:text-rose-700 font-medium hover:underline transition">
                ล้างข้อมูลทั้งหมด
            </button>
        </div>

    </div>

</body>

</html>
